<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Contact Message</title>
</head>
<body style="margin:0;padding:0;background-color:#09071a;font-family:'Helvetica Neue',Arial,sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#09071a;padding:48px 20px;">
    <tr>
      <td align="center">

        <!-- Card -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;border-radius:20px;overflow:hidden;border:1px solid rgba(124,58,237,0.35);background-color:#0f0c22;">

          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#7c3aed 0%,#5b21b6 100%);padding:36px 40px;text-align:center;">
              {% if logo_url %}
              <img src="{{ logo_url }}" alt="Logo" width="52" height="52"
                   style="display:block;margin:0 auto 16px;border-radius:12px;border:2px solid rgba(255,255,255,0.2);">
              {% endif %}
              <p style="margin:0 0 4px;color:#ddd6fe;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;font-weight:600;">Portfolio Website</p>
              <h1 style="margin:0;color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-0.01em;">New Contact Message</h1>
            </td>
          </tr>

          <!-- Sender card -->
          <tr>
            <td style="padding:32px 40px 0;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0"
                     style="background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.22);border-radius:14px;overflow:hidden;">
                <!-- Name row -->
                <tr>
                  <td style="padding:16px 20px;border-bottom:1px solid rgba(124,58,237,0.15);">
                    <span style="display:block;color:#a78bfa;font-size:10px;text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:5px;">From</span>
                    <span style="color:#f1eeff;font-size:16px;font-weight:600;">{{ sender_name }}</span>
                  </td>
                </tr>
                <!-- Email row -->
                <tr>
                  <td style="padding:16px 20px;">
                    <span style="display:block;color:#a78bfa;font-size:10px;text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:5px;">Email</span>
                    <a href="mailto:{{ sender_email }}" style="color:#c4b5fd;font-size:15px;text-decoration:none;">{{ sender_email }}</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Subject -->
          <tr>
            <td style="padding:24px 40px 0;">
              <p style="margin:0 0 6px;color:#a78bfa;font-size:10px;text-transform:uppercase;letter-spacing:0.1em;font-weight:600;">Subject</p>
              <p style="margin:0;color:#ede9fe;font-size:20px;font-weight:700;letter-spacing:-0.01em;">{{ subject }}</p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:20px 40px 0;">
              <div style="height:1px;background:linear-gradient(90deg,rgba(124,58,237,0.5),rgba(124,58,237,0.05));"></div>
            </td>
          </tr>

          <!-- Message body -->
          <tr>
            <td style="padding:20px 40px 0;">
              <p style="margin:0 0 12px;color:#a78bfa;font-size:10px;text-transform:uppercase;letter-spacing:0.1em;font-weight:600;">Message</p>
              <p style="margin:0;color:#cfc4ef;font-size:15px;line-height:1.75;white-space:pre-wrap;">{{ message }}</p>
            </td>
          </tr>

          <!-- Reply button -->
          <tr>
            <td style="padding:32px 40px;text-align:center;">
              <a href="mailto:{{ sender_email }}?subject=Re: {{ subject }}"
                 style="display:inline-block;background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 100%);color:#ffffff;text-decoration:none;font-weight:700;font-size:14px;padding:14px 32px;border-radius:10px;letter-spacing:0.03em;">
                Reply to {{ sender_name }}
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 40px 28px;border-top:1px solid rgba(124,58,237,0.15);text-align:center;">
              <p style="margin:0;color:#4c3f72;font-size:12px;line-height:1.6;">
                Sent via the contact form on
                <a href="{{ site_url }}" style="color:#7c5fc4;text-decoration:none;">{{ site_url }}</a>
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
