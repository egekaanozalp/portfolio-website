<!DOCTYPE html>
<html lang="en" bgcolor="#09071a" style="background-color:#09071a;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>New Contact Message</title>
  <style>
    :root { color-scheme: dark; }
    html, body, #body-wrap, .outer-td, table[bgcolor="#09071a"], td[bgcolor="#09071a"] {
      background-color: #09071a !important;
    }
  </style>
</head>
<body bgcolor="#09071a" style="margin:0;padding:0;background-color:#09071a;font-family:'Helvetica Neue',Arial,sans-serif;">
<div id="body-wrap" style="background-color:#09071a;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#09071a" style="background-color:#09071a;">
    <tr>
      <td class="outer-td" align="center" bgcolor="#09071a"
          background="{{ bg_url }}"
          style="background-color:#09071a;background-image:url('{{ bg_url }}');background-repeat:repeat;padding:36px 20px;">

        <!-- Card -->
        <table width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;border-radius:16px;overflow:hidden;border:1px solid rgba(124,58,237,0.3);background-color:#0f0c22;">

          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#7c3aed 0%,#5b21b6 100%);padding:22px 32px;text-align:center;">
              {% if logo_url %}
              <img src="{{ logo_url }}" alt="Logo" width="40" height="40"
                   style="display:block;margin:0 auto 10px;border-radius:9px;border:1px solid rgba(255,255,255,0.18);">
              {% endif %}
              <p style="margin:0 0 3px;color:rgba(233,213,255,0.9);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;font-weight:500;">Portfolio Website</p>
              <p style="margin:0;color:#ffffff;font-size:16px;font-weight:600;letter-spacing:-0.01em;">New Contact Message</p>
            </td>
          </tr>

          <!-- Sender card -->
          <tr>
            <td style="padding:24px 32px 0;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0"
                     style="background:rgba(124,58,237,0.07);border:1px solid rgba(124,58,237,0.2);border-radius:10px;overflow:hidden;">
                <tr>
                  <td style="padding:13px 18px;border-bottom:1px solid rgba(124,58,237,0.12);">
                    <span style="display:block;color:#a78bfa;font-size:9px;text-transform:uppercase;letter-spacing:0.12em;font-weight:600;margin-bottom:3px;">From</span>
                    <span style="color:#ede9fe;font-size:14px;font-weight:500;">{{ sender_name }}</span>
                  </td>
                </tr>
                <tr>
                  <td style="padding:13px 18px;">
                    <span style="display:block;color:#a78bfa;font-size:9px;text-transform:uppercase;letter-spacing:0.12em;font-weight:600;margin-bottom:3px;">Email</span>
                    <a href="mailto:{{ sender_email }}" style="color:#c4b5fd;font-size:13px;text-decoration:none;">{{ sender_email }}</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Subject -->
          <tr>
            <td style="padding:20px 32px 0;">
              <p style="margin:0 0 4px;color:#a78bfa;font-size:9px;text-transform:uppercase;letter-spacing:0.12em;font-weight:600;">Subject</p>
              <p style="margin:0;color:#ede9fe;font-size:16px;font-weight:600;letter-spacing:-0.01em;">{{ subject }}</p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:16px 32px 0;">
              <div style="height:1px;background:linear-gradient(90deg,rgba(124,58,237,0.45),rgba(124,58,237,0.03));"></div>
            </td>
          </tr>

          <!-- Message -->
          <tr>
            <td style="padding:16px 32px 0;">
              <p style="margin:0 0 10px;color:#a78bfa;font-size:9px;text-transform:uppercase;letter-spacing:0.12em;font-weight:600;">Message</p>
              <p style="margin:0;color:#bfb3e0;font-size:14px;line-height:1.75;white-space:pre-wrap;">{{ message }}</p>
            </td>
          </tr>

          <!-- Reply button -->
          <tr>
            <td style="padding:24px 32px;text-align:center;">
              <a href="mailto:{{ sender_email }}?subject=Re: {{ subject }}"
                 style="display:inline-block;background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 100%);color:#ffffff;text-decoration:none;font-weight:600;font-size:13px;padding:11px 26px;border-radius:8px;letter-spacing:0.02em;">
                Reply to {{ sender_name }}
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:16px 32px 22px;border-top:1px solid rgba(124,58,237,0.12);text-align:center;">
              <p style="margin:0;color:#4a3f6e;font-size:11px;">
                <a href="{{ site_url }}" style="color:#6b55a0;text-decoration:none;">{{ site_url }}</a>
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</div>
</body>
</html>
